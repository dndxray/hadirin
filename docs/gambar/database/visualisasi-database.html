<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hadirin — Visualisasi Database Firestore</title>
  <style>
    :root{color-scheme:light;--ink:#172b4d;--muted:#52637a;--line:#d9e2ec;--paper:#f4f6f9;--blue:#2456a6;--teal:#126b68}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif}
    header,.toolbar,.caption{max-width:1600px;margin:auto;padding:22px 28px}header{padding-bottom:10px}h1{font-size:30px;margin:0 0 8px;font-weight:700}p{margin:0;line-height:1.6;color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:.15em;font-weight:700;color:var(--teal);margin-bottom:8px}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px;padding-bottom:16px}button,a.control{font:inherit;font-size:14px;min-height:44px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}button[aria-selected=true]{background:var(--ink);color:white;border-color:var(--ink)}button:focus-visible,a:focus-visible{outline:3px solid #328884;outline-offset:3px}.spacer{flex:1}
    main{max-width:1920px;margin:auto;padding:0 24px 16px}.panel{background:white;border:1px solid var(--line);border-radius:12px;overflow:auto}.panel[hidden]{display:none}.diagram{display:block;width:100%;height:auto;min-width:640px}.caption{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding-top:8px;padding-bottom:20px}.caption p{flex:1;min-width:220px}.caption a{font-size:14px;color:var(--blue)}#stage:fullscreen{background:white;padding:0;max-width:none;display:flex;align-items:center;justify-content:center}#stage:fullscreen .panel:not([hidden]){border:0;border-radius:0;max-height:100vh;max-width:100vw;overflow:auto}#stage:fullscreen .diagram{width:min(100vw,calc(100vh * var(--ratio)));min-width:0}
    @media(max-width:650px){header,.toolbar,.caption{padding-left:16px;padding-right:16px}h1{font-size:24px}main{padding-left:10px;padding-right:10px}.toolbar{gap:6px}.toolbar button{flex:1 1 140px}.spacer{display:none}.caption{align-items:flex-start}}
    @media print{header,.toolbar,.caption{display:none}main{padding:0;max-width:none}.panel,.panel[hidden]{display:block;border:0;border-radius:0;break-after:page}.diagram{width:100%;min-width:0}body{background:white}}
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">HADIRIN / SPRINT 1–3 / DATA MODEL</div>
    <h1>Relasi database Hadirin</h1>
    <p>Model Firestore berdasarkan kode <strong>main 1bd53d7</strong>, 26 November 2026. Halaman ini dapat dibuka offline.</p>
  </header>
  <nav class="toolbar" aria-label="Pilihan diagram" role="tablist">
    <button type="button" role="tab" id="tab-0" aria-controls="panel-0" aria-selected="true" data-index="0">01 · Peta relasi</button>
    <button type="button" role="tab" id="tab-1" aria-controls="panel-1" aria-selected="false" data-index="1">02 · Skema inti</button>
    <button type="button" role="tab" id="tab-2" aria-controls="panel-2" aria-selected="false" data-index="2">03 · Catatan &amp; master</button>
    <button type="button" role="tab" id="tab-3" aria-controls="panel-3" aria-selected="false" data-index="3">04 · Akun &amp; NIM</button>
    <button type="button" role="tab" id="tab-4" aria-controls="panel-4" aria-selected="false" data-index="4">05 · Contoh dokumen</button>
    <span class="spacer"></span><button type="button" id="fullscreen" role="button">Layar penuh</button>

  <main id="stage" aria-label="Gambar database"></main>
  <div class="caption">
    <p id="description" aria-live="polite"></p>
    <a id="png-link" href="01-peta-relasi.png">Buka PNG</a>
    <a id="svg-link" href="01-peta-relasi.svg">Buka SVG tajam</a>
    <a href="visualisasi-database.md">Penjelasan &amp; bahan presentasi</a>
  </div>
  <script>
    'use strict';
    const esc=value=>String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    const text=(x,y,value,cls='body',anchor='start')=>`<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}" xml:space="preserve">${esc(value)}</text>`;
    const multiline=(x,y,lines,cls='body',step=30)=>lines.map((line,index)=>text(x,y+step*index,line,cls)).join('');
    const rect=(x,y,w,h,cls='card',radius=14)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${radius}" class="${cls}"/>`;
    const edge=(d,dashed=false)=>`<path d="${d}" class="${dashed?'edge lookup':'edge'}" marker-end="url(#${dashed?'lookup-arrow':'arrow'})"/>`;
    const label=(x,y,value,width=220,cls='edge-label')=>rect(x-width/2,y-20,width,32,'label-bg',5)+text(x,y+3,value,cls,'middle');
    function box(x,y,w,h,title,subtitle,lines,tone='normal'){
      return `<g data-card="${esc(title)}" data-box="${x},${y},${w},${h}">${rect(x,y,w,h,tone==='external'?'external':'card')}${rect(x,y,w,7,tone==='external'?'auth-bar':'accent',3)}${text(x+24,y+42,title,'node-title')}${text(x+24,y+70,subtitle,'small')}${multiline(x+24,y+108,lines,'body',30)}</g>`;
    }
    function note(x,y,w,h,title,lines,tone='note'){
      return `<g data-card="${esc(title)}" data-box="${x},${y},${w},${h}">${rect(x,y,w,h,tone)}${text(x+22,y+35,title,'note-title')}${multiline(x+22,y+68,lines,'small',27)}</g>`;
    }
    function schema(x,y,w,title,idHint,rows,notes=[]){
      const h=94+rows.length*30+(notes.length?22+notes.length*26:16);
      let body=rect(x,y,w,h)+rect(x,y,w,7,'accent',3)+text(x+22,y+39,title,'node-title')+text(x+22,y+67,idHint,'small');
      rows.forEach(([name,type],index)=>{
        const yy=y+104+index*30;
        body+=`<line x1="${x+22}" y1="${yy+10}" x2="${x+w-22}" y2="${yy+10}" class="row-line"/>`;
        body+=text(x+22,yy,name,'field')+text(x+w-22,yy,type,'type','end');
      });
      body+=multiline(x+22,y+112+rows.length*30,notes,'small',26);
      return `<g data-card="${esc(title)}" data-box="${x},${y},${w},${h}">${body}</g>`;
    }
    const svgStyle=`
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#172b4d}.kicker{font-size:18px;font-weight:700;letter-spacing:2px;fill:#126b68}.title{font-size:44px;font-weight:700;letter-spacing:-.7px}.subtitle{font-size:22px;fill:#52637a}.body{font-size:23px}.small{font-size:20px;fill:#52637a}.node-title{font-size:28px;font-weight:700}.note-title{font-size:23px;font-weight:700}.field{font-family:Consolas,'Courier New',monospace;font-size:20px}.type{font-size:18px;fill:#52637a}.edge-label{font-size:21px;font-weight:600}.footer{font-size:18px;fill:#63738a}.card{fill:#fff;stroke:#ccd7e4;stroke-width:1.5}.external{fill:#edf2fc;stroke:#7b98bd;stroke-width:1.5;stroke-dasharray:8 5}.accent{fill:#126b68}.auth-bar{fill:#2456a6}.note{fill:#f0f5f7;stroke:#d5e0e6;stroke-width:1}.warning{fill:#fff5df;stroke:#e4ca91;stroke-width:1}.good{fill:#eaf5ed;stroke:#a3c8ae;stroke-width:1}.label-bg{fill:#f8fafc}.edge{fill:none;stroke:#263f63;stroke-width:2.6;stroke-linejoin:round}.lookup{stroke:#84602b;stroke-dasharray:8 6}.row-line{stroke:#edf1f5;stroke-width:1}.separator{stroke:#d9e2ec;stroke-width:1.5}
    `;
    function frame(number,id,title,subtitle,body,height=1200){
      const diagram = body.replace(/url\(#(arrow|lookup-arrow)\)/g, (_, marker) => `url(#${id}-${marker})`);
      return `<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="${height}" viewBox="0 0 1920 ${height}" class="diagram" role="img" aria-labelledby="title-${id} desc-${id}" data-export="${id}" style="--ratio:${1920/height}"><title id="title-${id}">${esc(title)}</title><desc id="desc-${id}">${esc(subtitle)}</desc><defs><style>${svgStyle}</style><marker id="${id}-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#263f63"/></marker><marker id="${id}-lookup-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#84602b"/></marker></defs><rect width="1920" height="${height}" fill="#f8fafc"/>${text(64,48,`HADIRIN / FIRESTORE / ${number} DARI 05`,'kicker')}${text(64,105,title,'title')}${text(64,145,subtitle,'subtitle')}${diagram}<line x1="64" y1="${height-65}" x2="1856" y2="${height-65}" class="separator"/>${text(64,height-30,'Skema kode main 1bd53d7 · 26 November 2026 · ID relasi disimpan sebagai string','footer')}${text(1856,height-30,number+' / 05','footer','end')}</svg>`;
    }
    function overview(){
      let b='';
      b+=edge('M 270 320 L 270 410');
      b+=edge('M 480 530 L 700 530');
      b+=edge('M 480 580 L 700 580');
      b+=edge('M 270 615 L 270 800',true);
      b+=edge('M 480 870 L 595 870 L 595 690 L 700 690');
      b+=edge('M 960 350 L 960 480');
      b+=edge('M 1180 265 L 1450 265');
      b+=edge('M 1220 560 L 1330 560 L 1330 350 L 1450 350');
      b+=edge('M 1220 630 L 1450 630');
      b+=edge('M 1220 690 L 1330 690 L 1330 980 L 1450 980');
      b+=box(60,190,420,130,'Firebase Authentication','Layanan akun; di luar Firestore',['UID + email/password'],'external');
      b+=box(60,410,420,205,'users/{UID}','Profil akun; UID = ID dokumen',['name · role / roles · nim','Praktikan dan asisten']);
      b+=box(60,800,420,190,'classes/{classId}','Kelas dan roster',['course · name · room','participants: [{nim, name}]']);
      b+=box(740,190,440,160,'labs/{labId}','Titik acuan presensi',['latitude · longitude · radiusMeters']);
      b+=box(700,480,520,250,'sessions/{sessionId}','Satu pertemuan praktikum',['classId* · labId* · assistantId','participantIds: [UID]','tanggal/jam · status','radius sesi: lihat gambar 02']);
      b+=box(1450,190,410,190,'attendance/{ID}','Kehadiran praktikan',['sessionId · practitionerId','labId · waktu · location']);
      b+=box(1450,550,410,220,'permissionRequests/{ID}','Pengajuan izin',['sessionId · practitionerId','reason · status · ai','decidedBy: UID asisten']);
      b+=box(1450,890,410,150,'notifications/{ID}','Pemberitahuan penerima',['toUserId · sessionId*']);
      b+=label(270,370,'UID = ID profil · 1:0..1',280);
      b+=label(590,505,'N:M · participantIds[]',212);
      b+=label(590,556,'1:N · assistantId',190);
      b+=label(270,699,'N:M · pencocokan NIM',250);
      b+=label(590,900,'classId* · 1:N',205);
      b+=label(960,415,'labId* · 1:N',210);
      b+=label(1315,240,'labId · 1:N',190);
      b+=label(1327,418,'sessionId · 1:N',210);
      b+=label(1335,607,'sessionId · 1:N',210);
      b+=label(1330,843,'sessionId* · 1:N',220);
      b+=note(700,820,520,220,'Cara membaca',['1:0..1 = satu akun, maksimal satu profil.','1:N = satu induk, nol atau banyak catatan.','N:M = banyak akun dan banyak sesi/kelas.','Garis putus-putus = pencocokan teks NIM.','Relasi UID lain dirinci pada gambar 04.']);
      b+=note(60,1050,1180,90,'Tujuh koleksi operasional',['Master aktif matkul dan modul lama courses ada pada gambar 03–04. * = opsional atau bisa kosong.']);
      return frame('01','01-peta-relasi','Peta relasi dari akun sampai catatan','Panah mengarah dari dokumen yang dirujuk ke dokumen yang menyimpan ID. Roster kelas dicocokkan melalui NIM.',b,1240);
    }
    function coreSchema(){
      let b=schema(64,190,560,'users','ID dokumen = UID Firebase Auth',[
        ['name','string'],['email','string'],['role','praktikan | asisten'],['roles*','array peran'],['nim*','string'],['approvalStatus*','pending | approved'],['createdAt','Timestamp'],['expoPushTokens*','array<string>'],['matkul_diampu*','array<ID>']
      ],['UID untuk kepemilikan data.','NIM untuk menemukan akun.']);
      b+=schema(680,190,560,'classes','ID dibuat otomatis; bukan ID sesi',[
        ['name','string'],['course','string (nama)'],['room','string'],['participants','array<map>'],['  nim','string / elemen'],['  name','string / elemen'],['createdBy','string UID'],['createdAt','Timestamp']
      ],['participants adalah array tertanam.','Bukan collection peserta terpisah.']);
      b+=schema(680,690,560,'labs','ID lab direferensikan oleh sesi',[
        ['name','string'],['latitude','number'],['longitude','number'],['radiusMeters','number (m)']
      ],['Radius 1–1.000 m; koordinat angka.']);
      b+=schema(1296,190,560,'sessions','ID = satu pertemuan, bukan kelas',[
        ['courseName','string'],['courseCode','string'],['classId*','string ID (bisa kosong)'],['className','string'],['date','Timestamp¹'],['dateTimestamp','Timestamp'],['dateLabel','string'],['startTime','string'],['endTime','string'],['timeRange','string'],['room','string'],['description','string'],['assistantId','string UID'],['assistantName','string'],['status','enum'],['participantIds','array<UID>'],['labId*','string ID'],['radiusM*','number · ditulis form'],['attendanceRadiusMeters*','number · dibaca validator'],['qrToken*','string · dibaca scanner'],['createdAt','Timestamp'],['updatedAt*','Timestamp']
      ],['status: upcoming | open | closed.','¹ Penulisan baru; ada data legacy.']);
      b+=note(64,760,560,250,'Cara membaca field',['Koleksi → dokumen → field.','[] = array di dalam dokumen.','Map = objek di dalam dokumen.','ID relasi disimpan sebagai string.','* = opsional atau hanya ada pada data tertentu.']);
      b+=note(1296,1038,560,112,'Radius dan QR belum terhubung',['Tanpa field override, pakai radius lab.','Penampil QR sesi belum memasok qrToken.'],'warning');
      b+=note(680,1000,560,130,'Ruangan dan lokasi GPS',['room menyimpan label ruangan.','labId menunjuk koordinat dan radius.']);
      return frame('02','02-skema-inti','Skema inti: identitas, kelas, sesi, lab','Field yang terlihat pada pembaca/penulis kode. ID dokumen ditampilkan pada header, bukan field id tambahan.',b,1240);
    }
    function recordSchema(){
      let b=schema(64,190,560,'attendance','ID deterministik: sessionId_UID',[
        ['sessionId','string ID'],['practitionerId','string UID'],['checkedInAt','Timestamp server'],['session','map / snapshot'],['  courseName','string'],['  className','string'],['  dateLabel','string'],['  timeRange','string'],['  room','string'],['  assistantName','string'],['labId¹','string ID'],['method¹','location | qr'],['location¹','map'],['  point','GeoPoint'],['  accuracy','number (m)'],['  observedAt','Timestamp posisi'],['qrToken*','string · hanya metode qr']
      ],['¹ Wajib pada presensi yang dibuat sekarang.','Catatan Sprint 2 bisa belum punya bukti GPS.']);
      b+=schema(680,190,560,'permissionRequests','ID pasangan sama dengan presensi',[
        ['sessionId','string ID'],['practitionerId','string UID'],['reason','string (10–1.000 karakter)'],['status','pending/approved/rejected'],['createdAt','Timestamp server'],['session','map / 6 field yang sama'],['ai','map'],['  status','pending/success/failed'],['  category*','string sentimen'],['  error*','string'],['decisionNote*','string'],['decidedBy*','string UID'],['decidedAt*','Timestamp server']
      ],['status = keputusan manusia.','ai.status = proses klasifikasi.']);
      b+=schema(1296,190,560,'notifications','ID otomatis per penerima',[
        ['toUserId','string UID'],['type','enum kegiatan'],['title','string'],['body','string'],['sessionId*','string ID'],['createdAt','number (milidetik)'],['read','boolean']
      ],['Listener membuat notifikasi lokal dari event ini.','Token push tersimpan di users.expoPushTokens.']);
      b+=schema(1296,620,560,'matkul','Master aktif pada halaman Kelas',[
        ['nama_matkul*','string'],['nama*','string (fallback)']
      ],['ID dicocokkan dengan users.matkul_diampu[].']);
      b+=schema(1296,870,560,'courses','Modul lama tanpa pemanggil UI aktif',[
        ['name','string'],['code','string'],['defaultRoom*','string'],['defaultDescription*','string']
      ],['Skema dikenali di kode dan Rules lokal.','Form sesi mengambil mata kuliah dari classes.']);
      b+=note(64,950,560,190,'Snapshot menjaga riwayat',['session adalah salinan 6 field.','Tidak membuat collection baru.','Sesi berubah/hilang: teks historis','masih dapat ditampilkan.']);
      b+=note(680,850,560,240,'Tipe data Firestore',['Timestamp = waktu terstruktur.','GeoPoint = titik latitude/longitude.','Map/array = isi tertanam.','* = field opsional atau bersyarat.']);
      return frame('03','03-skema-catatan-master','Skema catatan dan master mata kuliah','Kehadiran, pengajuan, dan notifikasi disimpan per dokumen. Jalur aktif halaman Kelas memakai matkul.',b,1260);
    }
    function accounts(){
      let b=rect(64,190,900,680,'note')+text(90,235,'A. Pemetaan NIM ke UID peserta sesi','node-title');
      b+=box(90,285,355,180,'users/uid-praktikan-A','Dokumen akun',['nim: "12345678901234"','role: praktikan']);
      b+=box(565,285,370,180,'classes/kelas-ml-b','Array participants',['{nim: "12345678901234",',' name: "Praktikan A"}']);
      b+=edge('M 445 365 L 565 365',true)+label(505,337,'NIM ==',100);
      b+=edge('M 265 465 L 265 530')+edge('M 750 465 L 750 530');
      b+=note(170,530,650,110,'Pemetaan oleh service',['Ambil UID jika tepat satu akun praktikan cocok.','resolveParticipantUids / syncClassSessions']);
      b+=edge('M 500 640 L 500 710')+label(500,680,'simpan UID peserta',245);
      b+=box(190,710,620,130,'sessions/sesi-01','UID masuk ke peserta sesi',['participantIds: ["uid-praktikan-A"]']);
      b+=note(64,920,900,210,'B. Mata kuliah pada alur aktif',['users.matkul_diampu[] berisi ID dokumen matkul.','Halaman Kelas menyimpan nama sebagai classes.course.','Form sesi memakai nama itu untuk sessions.courseName.','courses tersedia di kode lama tanpa pemanggil UI aktif.']);
      b+=box(1040,475,340,190,'users/{UID}','Profil akun',['role / roles menyimpan','peran yang dimiliki akun.','Garis kanan: referensi UID.']);
      b+=`<path d="M 1380 570 L 1420 570 L 1420 240 M 1420 570 L 1420 1060" class="edge"/>`;
      const targets=[
        [190,'sessions','assistantId','1 akun asisten → N sesi'],
        [350,'classes','createdBy','1 pembuat → N kelas'],
        [510,'attendance','practitionerId','1 praktikan → N presensi'],
        [670,'permissionRequests','practitionerId','1 praktikan → N izin'],
        [830,'permissionRequests','decidedBy*','1 asisten → N keputusan'],
        [990,'notifications','toUserId','1 penerima → N notifikasi']
      ];
      for(const [y,name,field,caption] of targets){
        b+=edge(`M 1420 ${y+50} L 1510 ${y+50}`);
        b+=`<g data-card="${esc(name+' '+field)}" data-box="1510,${y},350,120">${rect(1510,y,350,120)}${text(1530,y+31,name,'node-title')}${text(1530,y+62,field,'field')}${text(1530,y+94,caption,'small')}</g>`;
      }
      return frame('04','04-relasi-akun-nim','Relasi akun, kepesertaan, dan kepemilikan','Bagian A memakai ID dan nama ilustrasi. Bagian kanan menunjukkan dokumen yang menyimpan UID akun.',b,1240);
    }
    function example(){
      let b=note(64,190,1792,110,'Satu akun mengikuti dua sesi',['Kedua sesi menyimpan uid-praktikan-A di participantIds. Contoh ID sesi adalah sesi-01 dan sesi-02.']);
      b+=edge('M 960 300 L 960 350 L 480 350 L 480 410')+edge('M 960 350 L 1440 350 L 1440 410');
      b+=box(64,410,840,265,'Pertemuan 1: hadir','attendance/sesi-01_uid-praktikan-A',[
        'sessionId: "sesi-01"',
        'practitionerId: "uid-praktikan-A"',
        'checkedInAt: Timestamp server',
        'session: {6 field} · labId · method · location'
      ]);
      b+=box(1016,410,840,265,'Pertemuan 2: mengajukan izin','permissionRequests/sesi-02_uid-praktikan-A',[
        'sessionId: "sesi-02"',
        'practitionerId: "uid-praktikan-A"',
        'status: "pending" · ai.status: "pending"',
        'createdAt: Timestamp server · session: {6 field}',
        'reason: "Mengikuti kegiatan kampus."'
      ]);
      b+=note(64,730,1792,190,'Aturan pasangan sesi + praktikan',['Untuk pasangan yang sama, presensi dan izin saling mengecualikan: hanya salah satu boleh dibuat.','ID tetap + transaksi + Rules mencegah presensi kedua atau presensi bersamaan dengan izin.','Dokumen izin ditolak masih ada dan tetap memblokir presensi pada implementasi sekarang.'],'warning');
      const steps=[
        [64,'1. Validasi presensi','peserta + sesi open + GPS'],[530,'2. Transaksi','baca sesi + lab + dua catatan'],
        [996,'3. Commit','waktu server + snapshot'],[1462,'4. Listener','Riwayat dan rekap berubah']
      ];
      for(const [x,title,sub] of steps){b+=note(x,1000,394,120,title,[sub]);if(x<1400)b+=edge(`M ${x+394} 1060 L ${x+450} 1060`);}
      return frame('05','05-contoh-dokumen','Contoh dokumen dari dua pertemuan','Saat izin dibuat, status keputusan dan status AI sama-sama pending. Keduanya diproses secara terpisah.',b,1240);
    }
    const diagrams=[
      {id:'01-peta-relasi',label:'01 · Peta relasi',description:'Mulai dari kelas dan lab menuju satu sesi, lalu catatan peserta. Auth berada di luar Firestore.',svg:overview()},
      {id:'02-skema-inti',label:'02 · Skema inti',description:'Empat collection inti. Array peserta ada di dalam dokumen; ID dokumen tidak perlu ditulis sebagai field id tambahan.',svg:coreSchema()},
      {id:'03-skema-catatan-master',label:'03 · Catatan dan master',description:'Field dan tipe data presensi, izin, notifikasi, serta dua master mata kuliah. Map snapshot dan objek AI adalah embedded data.',svg:recordSchema()},
      {id:'04-relasi-akun-nim',label:'04 · Relasi akun dan NIM',description:'NIM dipetakan menjadi UID untuk enrollment. Sisi kanan memperlihatkan semua peran referensi akun.',svg:accounts()},
      {id:'05-contoh-dokumen',label:'05 · Contoh dokumen',description:'Contoh ilustrasi dua sesi, ID deterministik, transaksi, dan larangan memiliki presensi sekaligus izin untuk pasangan yang sama.',svg:example()}
    ];
    const stage=document.getElementById('stage');
    stage.innerHTML=diagrams.map((diagram,index)=>`<section id="panel-${index}" class="panel" role="tabpanel" aria-labelledby="tab-${index}" ${index?'hidden':''}>${diagram.svg}</section>`).join('');
    let active=0;
    function show(index,focus=false){
      active=(index+diagrams.length)%diagrams.length;
      document.querySelectorAll('[role="tab"]').forEach((tab,i)=>{tab.setAttribute('aria-selected',String(i===active));tab.tabIndex=i===active?0:-1;if(focus&&i===active)tab.focus();});
      document.querySelectorAll('[role="tabpanel"]').forEach((panel,i)=>panel.hidden=i!==active);
      const chosen=diagrams[active];document.getElementById('description').textContent=chosen.description;
      document.getElementById('png-link').href=`${chosen.id}.png`;
      document.getElementById('svg-link').href=`${chosen.id}.svg`;
    }
    document.querySelectorAll('[data-index]').forEach(button=>button.addEventListener('click',()=>show(Number(button.dataset.index))));
    document.addEventListener('keydown',event=>{if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();show(active+(event.key==='ArrowRight'?1:-1),true);}});
    document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await stage.requestFullscreen();}catch{document.getElementById('description').textContent='Layar penuh tidak tersedia. Gunakan F11 pada browser atau buka gambar SVG secara langsung.';}});
    show(0);
    window.databaseVisuals=diagrams.map(({id,label})=>({id,label}));
  </script>
</body>
</html>
