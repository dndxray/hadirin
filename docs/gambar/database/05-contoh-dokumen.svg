<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1240" viewBox="0 0 1920 1240" class="diagram" role="img" aria-labelledby="title-05-contoh-dokumen desc-05-contoh-dokumen" data-export="05-contoh-dokumen" style="--ratio:1.5483870967741935"><title id="title-05-contoh-dokumen">Contoh dokumen dari dua pertemuan</title><desc id="desc-05-contoh-dokumen">Saat izin dibuat, status keputusan dan status AI sama-sama pending. Keduanya diproses secara terpisah.</desc><defs><style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#172b4d}.kicker{font-size:18px;font-weight:700;letter-spacing:2px;fill:#126b68}.title{font-size:44px;font-weight:700;letter-spacing:-.7px}.subtitle{font-size:22px;fill:#52637a}.body{font-size:23px}.small{font-size:20px;fill:#52637a}.node-title{font-size:28px;font-weight:700}.note-title{font-size:23px;font-weight:700}.field{font-family:Consolas,'Courier New',monospace;font-size:20px}.type{font-size:18px;fill:#52637a}.edge-label{font-size:21px;font-weight:600}.footer{font-size:18px;fill:#63738a}.card{fill:#fff;stroke:#ccd7e4;stroke-width:1.5}.external{fill:#edf2fc;stroke:#7b98bd;stroke-width:1.5;stroke-dasharray:8 5}.accent{fill:#126b68}.auth-bar{fill:#2456a6}.note{fill:#f0f5f7;stroke:#d5e0e6;stroke-width:1}.warning{fill:#fff5df;stroke:#e4ca91;stroke-width:1}.good{fill:#eaf5ed;stroke:#a3c8ae;stroke-width:1}.label-bg{fill:#f8fafc}.edge{fill:none;stroke:#263f63;stroke-width:2.6;stroke-linejoin:round}.lookup{stroke:#84602b;stroke-dasharray:8 6}.row-line{stroke:#edf1f5;stroke-width:1}.separator{stroke:#d9e2ec;stroke-width:1.5}
    </style><marker id="05-contoh-dokumen-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#263f63"></path></marker><marker id="05-contoh-dokumen-lookup-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#84602b"></path></marker></defs><rect width="1920" height="1240" fill="#f8fafc"></rect><text x="64" y="48" class="kicker" text-anchor="start" xml:space="preserve">HADIRIN / FIRESTORE / 05 DARI 05</text><text x="64" y="105" class="title" text-anchor="start" xml:space="preserve">Contoh dokumen dari dua pertemuan</text><text x="64" y="145" class="subtitle" text-anchor="start" xml:space="preserve">Saat izin dibuat, status keputusan dan status AI sama-sama pending. Keduanya diproses secara terpisah.</text><g data-card="Satu akun mengikuti dua sesi" data-box="64,190,1792,110"><rect x="64" y="190" width="1792" height="110" rx="14" class="note"></rect><text x="86" y="225" class="note-title" text-anchor="start" xml:space="preserve">Satu akun mengikuti dua sesi</text><text x="86" y="258" class="small" text-anchor="start" xml:space="preserve">Kedua sesi menyimpan uid-praktikan-A di participantIds. Contoh ID sesi adalah sesi-01 dan sesi-02.</text></g><path d="M 960 300 L 960 350 L 480 350 L 480 410" class="edge" marker-end="url(#05-contoh-dokumen-arrow)"></path><path d="M 960 350 L 1440 350 L 1440 410" class="edge" marker-end="url(#05-contoh-dokumen-arrow)"></path><g data-card="Pertemuan 1: hadir" data-box="64,410,840,265"><rect x="64" y="410" width="840" height="265" rx="14" class="card"></rect><rect x="64" y="410" width="840" height="7" rx="3" class="accent"></rect><text x="88" y="452" class="node-title" text-anchor="start" xml:space="preserve">Pertemuan 1: hadir</text><text x="88" y="480" class="small" text-anchor="start" xml:space="preserve">attendance/sesi-01_uid-praktikan-A</text><text x="88" y="518" class="body" text-anchor="start" xml:space="preserve">sessionId: "sesi-01"</text><text x="88" y="548" class="body" text-anchor="start" xml:space="preserve">practitionerId: "uid-praktikan-A"</text><text x="88" y="578" class="body" text-anchor="start" xml:space="preserve">checkedInAt: Timestamp server</text><text x="88" y="608" class="body" text-anchor="start" xml:space="preserve">session: {6 field} · labId · method · location</text></g><g data-card="Pertemuan 2: mengajukan izin" data-box="1016,410,840,265"><rect x="1016" y="410" width="840" height="265" rx="14" class="card"></rect><rect x="1016" y="410" width="840" height="7" rx="3" class="accent"></rect><text x="1040" y="452" class="node-title" text-anchor="start" xml:space="preserve">Pertemuan 2: mengajukan izin</text><text x="1040" y="480" class="small" text-anchor="start" xml:space="preserve">permissionRequests/sesi-02_uid-praktikan-A</text><text x="1040" y="518" class="body" text-anchor="start" xml:space="preserve">sessionId: "sesi-02"</text><text x="1040" y="548" class="body" text-anchor="start" xml:space="preserve">practitionerId: "uid-praktikan-A"</text><text x="1040" y="578" class="body" text-anchor="start" xml:space="preserve">status: "pending" · ai.status: "pending"</text><text x="1040" y="608" class="body" text-anchor="start" xml:space="preserve">createdAt: Timestamp server · session: {6 field}</text><text x="1040" y="638" class="body" text-anchor="start" xml:space="preserve">reason: "Mengikuti kegiatan kampus."</text></g><g data-card="Aturan pasangan sesi + praktikan" data-box="64,730,1792,190"><rect x="64" y="730" width="1792" height="190" rx="14" class="warning"></rect><text x="86" y="765" class="note-title" text-anchor="start" xml:space="preserve">Aturan pasangan sesi + praktikan</text><text x="86" y="798" class="small" text-anchor="start" xml:space="preserve">Untuk pasangan yang sama, presensi dan izin saling mengecualikan: hanya salah satu boleh dibuat.</text><text x="86" y="825" class="small" text-anchor="start" xml:space="preserve">ID tetap + transaksi + Rules mencegah presensi kedua atau presensi bersamaan dengan izin.</text><text x="86" y="852" class="small" text-anchor="start" xml:space="preserve">Dokumen izin ditolak masih ada dan tetap memblokir presensi pada implementasi sekarang.</text></g><g data-card="1. Validasi presensi" data-box="64,1000,394,120"><rect x="64" y="1000" width="394" height="120" rx="14" class="note"></rect><text x="86" y="1035" class="note-title" text-anchor="start" xml:space="preserve">1. Validasi presensi</text><text x="86" y="1068" class="small" text-anchor="start" xml:space="preserve">peserta + sesi open + GPS</text></g><path d="M 458 1060 L 514 1060" class="edge" marker-end="url(#05-contoh-dokumen-arrow)"></path><g data-card="2. Transaksi" data-box="530,1000,394,120"><rect x="530" y="1000" width="394" height="120" rx="14" class="note"></rect><text x="552" y="1035" class="note-title" text-anchor="start" xml:space="preserve">2. Transaksi</text><text x="552" y="1068" class="small" text-anchor="start" xml:space="preserve">baca sesi + lab + dua catatan</text></g><path d="M 924 1060 L 980 1060" class="edge" marker-end="url(#05-contoh-dokumen-arrow)"></path><g data-card="3. Commit" data-box="996,1000,394,120"><rect x="996" y="1000" width="394" height="120" rx="14" class="note"></rect><text x="1018" y="1035" class="note-title" text-anchor="start" xml:space="preserve">3. Commit</text><text x="1018" y="1068" class="small" text-anchor="start" xml:space="preserve">waktu server + snapshot</text></g><path d="M 1390 1060 L 1446 1060" class="edge" marker-end="url(#05-contoh-dokumen-arrow)"></path><g data-card="4. Listener" data-box="1462,1000,394,120"><rect x="1462" y="1000" width="394" height="120" rx="14" class="note"></rect><text x="1484" y="1035" class="note-title" text-anchor="start" xml:space="preserve">4. Listener</text><text x="1484" y="1068" class="small" text-anchor="start" xml:space="preserve">Riwayat dan rekap berubah</text></g><line x1="64" y1="1175" x2="1856" y2="1175" class="separator"></line><text x="64" y="1210" class="footer" text-anchor="start" xml:space="preserve">Skema kode main 1bd53d7 · 26 November 2026 · ID relasi disimpan sebagai string</text><text x="1856" y="1210" class="footer" text-anchor="end" xml:space="preserve">05 / 05</text></svg>
