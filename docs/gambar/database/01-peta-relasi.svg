="small" text-anchor="start" xml:space="preserve">Master aktif matkul dan modul lama courses ada pada gambar 03–04. * = opsional atau bisa kosong.</text></g><line x1="64" y1="1175" x2="1856" y2="1175" class="separator"></line><text x="64" y="1210" class="footer" text-anchor="start" xml:space="preserve">Skema kode main 1bd53d7 · 26 November 2026 · ID relasi disimpan sebagai string</text><text x="1856" y="1210" class="footer" text-anchor="end" xml:space="preserve">01 / 05</text></svg>
