"14" class="external"></rect><rect x="60" y="190" width="420" height="7" rx="3" class="auth-bar"></rect><text x="84" y="232" class="node-title" text-anchor="start" xml:space="preserve">Firebase Authentication</text><text x="84" y="260" class="small" text-anchor="start" xml:space="preserve">Layanan akun; di luar Firestore</text><text x="84" y="298" class="body" text-anchor="start" xml:space="preserve">UID + email/password</text></g><g data-card="users/{UID}" data-box="60,410,420,205"><rect x="60" y="410" width="420" height="205" rx="14" class="card"></rect><rect x="60" y="410" width="420" height="7" rx="3" class="accent"></rect><text x="84" y="452" class="node-title" text-anchor="start" xml:space="preserve">users/{UID}</text><text x="84" y="480" class="small" text-anchor="start" xml:space="preserve">Profil akun; UID = ID dokumen</text><text x="84" y="518" class="body" text-anchor="start" xml:space="preserve">name · role / roles · nim</text><text x="84" y="548" class="body" text-anchor="start" xml:space="preserve">Praktikan dan asisten</text></g><g data-card="classes/{classId}" data-box="60,800,420,190"><rect x="60" y="800" width="420" height="190" rx="14" class="card"></rect><rect x="60" y="800" width="420" height="7" rx="3" class="accent"></rect><text x="84" y="842" class="node-title" text-anchor="start" xml:space="preserve">classes/{classId}</text><text x="84" y="870" class="small" text-anchor="start" xml:space="preserve">Kelas dan roster</text><text x="84" y="908" class="body" text-anchor="start" xml:space="preserve">course · name · room</text><text x="84" y="938" class="body" text-anchor="start" xml:space="preserve">participants: [{nim, name}]</text></g><g data-card="labs/{labId}" data-box="740,190,440,160"><rect x="740" y="190" width="440" height="160" rx="14" class="card"></rect><rect x="740" y="190" width="440" height="7" rx="3" class="accent"></rect><text x="764" y="232" class="node-title" text-anchor="start" xml:space="preserve">labs/{labId}</text><text x="764" y="260" class="small" text-anchor="start" xml:space="preserve">Titik acuan presensi</text><text x="764" y="298" class="body" text-anchor="start" xml:space="preserve">latitude · longitude · radiusMeters</text></g><g data-card="sessions/{sessionId}" data-box="700,480,520,250"><rect x="700" y="480" width="520" height="250" rx="14" class="card"></rect><rect x="700" y="480" width="520" height="7" rx="3" class="accent"></rect><text x="724" y="522" class="node-title" text-anchor="start" xml:space="preserve">sessions/{sessionId}</text><text x="724" y="550" class="small" text-anchor="start" xml:space="preserve">Satu pertemuan praktikum</text><text x="724" y="588" class="body" text-anchor="start" xml:space="preserve">classId* · labId* · assistantId</text><text x="724" y="618" class="body" text-anchor="start" xml:space="preserve">participantIds: [UID]</text><text x="724" y="648" class="body" text-anchor="start" xml:space="preserve">tanggal/jam · status</text><text x="724" y="678" class="body" text-anchor="start" xml:space="preserve">radius sesi: lihat gambar 02</text></g><g data-card="attendance/{ID}" data-box="1450,190,410,190"><rect x="1450" y="190" width="410" height="190" rx="14" class="card"></rect><rect x="1450" y="190" width="410" height="7" rx="3" class="accent"></rect><text x="1474" y="232" class="node-title" text-anchor="start" xml:space="preserve">attendance/{ID}</text><text x="1474" y="260" class="small" text-anchor="start" xml:space="preserve">Kehadiran praktikan</text><text x="1474" y="298" class="body" text-anchor="start" xml:space="preserve">sessionId · practitionerId</text><text x="1474" y="328" class="body" text-anchor="start" xml:space="preserve">labId · waktu · location</text></g><g data-card="permissionRequests/{ID}" data-box="1450,550,410,220"><rect x="1450" y="550" width="410" height="220" rx="14" class="card"></rect><rect x="1450" y="550" width="410" height="7" rx="3" class="accent"></rect><text x="1474" y="592" class="node-title" text-anchor="start" xml:space="preserve">permissionRequests/{ID}</text><text x="1474" y="620" class="small" text-anchor="start" xml:space="preserve">Pengajuan izin</text><text x="1474" y="658" class="body" text-anchor="start" xml:space="preserve">sessionId · practitionerId</text><text x="1474" y="688" class="body" text-anchor="start" xml:space="preserve">reason · status · ai</text><text x="1474" y="718" class="body" text-anchor="start" xml:space="preserve">decidedBy: UID asisten</text></g><g data-card="notifications/{ID}" data-box="1450,890,410,150"><rect x="1450" y="890" width="410" height="150" rx="14" class="card"></rect><rect x="1450" y="890" width="410" height="7" rx="3" class="accent"></rect><text x="1474" y="932" class="node-title" text-anchor="start" xml:space="preserve">notifications/{ID}</text><text x="1474" y="960" class="small" text-anchor="start" xml:space="preserve">Pemberitahuan penerima</text><text x="1474" y="998" class="body" text-anchor="start" xml:space="preserve">toUserId · sessionId*</text></g><rect x="130" y="350" width="280" height="32" rx="5" class="label-bg"></rect><text x="270" y="373" class="edge-label" text-anchor="middle" xml:space="preserve">UID = ID profil · 1:0..1</text><rect x="484" y="485" width="212" height="32" rx="5" class="label-bg"></rect><text x="590" y="508" class="edge-label" text-anchor="middle" xml:space="preserve">N:M · participantIds[]</text><rect x="495" y="536" width="190" height="32" rx="5" class="label-bg"></rect><text x="590" y="559" class="edge-label" text-anchor="middle" xml:space="preserve">1:N · assistantId</text><rect x="145" y="679" width="250" height="32" rx="5" class="label-bg"></rect><text x="270" y="702" class="edge-label" text-anchor="middle" xml:space="preserve">N:M · pencocokan NIM</text><rect x="487.5" y="880" width="205" height="32" rx="5" class="label-bg"></rect><text x="590" y="903" class="edge-label" text-anchor="middle" xml:space="preserve">classId* · 1:N</text><rect x="855" y="395" width="210" height="32" rx="5" 